<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin local DakarStyle</title>
  <style>
    :root { --ink:#11110f; --green:#0f5f35; --gold:#d7a83f; --line:rgba(17,17,15,.13); --paper:#fffdf8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, system-ui, Segoe UI, sans-serif; color:var(--ink); background:var(--paper); letter-spacing:0; }
    .wrap { width:min(1080px, calc(100% - 28px)); margin:0 auto; padding:32px 0; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(30px, 5vw, 54px); line-height:1; letter-spacing:0; }
    p { color:#68635b; line-height:1.6; }
    .btn { min-height:42px; border:1px solid transparent; border-radius:8px; padding:0 14px; font-weight:900; cursor:pointer; background:#11110f; color:#fff; }
    .btn.alt { background:#fff; color:#11110f; border-color:var(--line); }
    .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px; box-shadow:0 12px 30px rgba(0,0,0,.06); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    textarea { width:100%; min-height:520px; border:1px solid var(--line); border-radius:8px; padding:14px; font:13px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .products { display:grid; gap:10px; max-height:590px; overflow:auto; }
    .item { border:1px solid var(--line); border-radius:8px; padding:12px; display:grid; grid-template-columns:64px 1fr; gap:12px; }
    .item img { width:64px; height:78px; object-fit:cover; border-radius:8px; background:#eee; }
    .item strong { display:block; }
    .item span { color:var(--green); font-weight:900; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    @media (max-width:800px){ header,.grid{display:block}.panel{margin-top:14px} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Admin local DakarStyle</h1>
        <p>Outil simple pour verifier le catalogue avant une mise en ligne Cloudflare.</p>
      </div>
      <a class="btn alt" href="index.html">Voir le site</a>
    </header>
    <div class="grid">
      <section class="panel">
        <h2>Produits actuels</h2>
        <div class="products" id="list"></div>
      </section>
      <section class="panel">
        <h2>Fichier produits</h2>
        <textarea id="jsonBox"></textarea>
        <div class="actions">
          <button class="btn" onclick="downloadJson()">Telecharger products.json</button>
          <button class="btn alt" onclick="copyJson()">Copier</button>
          <a class="btn alt" href="https://wa.me/221773374762" target="_blank">WhatsApp</a>
        </div>
      </section>
    </div>
  </div>

    const fmt = value => new Intl.NumberFormat("fr-FR").format(value) + " FCFA";
    document.getElementById("jsonBox").value = JSON.stringify(products, null, 2);
    document.getElementById("list").innerHTML = products.map(item => `
      <article class="item">
        <img src="${item.img}" alt="">
        <div><strong>${item.name}</strong><span>${fmt(item.price)}</span><p>${item.desc}</p></div>
      </article>
    `).join("");
    function downloadJson(){
      const blob = new Blob([document.getElementById("jsonBox").value], { type:"application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "products.json";
      link.click();
      URL.revokeObjectURL(link.href);
    }
    async function copyJson(){
      await navigator.clipboard.writeText(document.getElementById("jsonBox").value);
      alert("Catalogue copie.");
    }
  </script>
</body>
</html>

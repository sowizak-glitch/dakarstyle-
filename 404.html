<!doctype html>

  <link rel="stylesheet" href="assets/css/dakarstyle-cwv-2026.css">
  <style>
    .not-found{min-height:100svh;display:grid;place-items:center;padding:32px;background:radial-gradient(circle at 15% 10%,rgba(215,168,63,.22),transparent 28%),radial-gradient(circle at 86% 84%,rgba(15,95,53,.2),transparent 30%),var(--cream)}

    .not-found h1{margin:12px 0 14px;font-size:clamp(44px,8vw,86px);line-height:.92;letter-spacing:-.05em}
    .not-found p{max-width:560px;margin:0 auto 26px;color:var(--muted);font-size:17px;line-height:1.6}
    .not-found-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    @media(max-width:640px){.not-found{padding:18px}.not-found-actions .btn{width:100%}}

</head>
<body>
  <main class="not-found">
    <section class="not-found-card">

        <a class="btn btn-dark" href="https://wa.me/221773374762?text=Bonjour%20DakarStyle" target="_blank" rel="noopener">WhatsApp</a>

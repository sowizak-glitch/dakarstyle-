name: Hotfix Instagram Login Multipart

on:
  push:
    branches:
      - hotfix/instagram-login-multipart

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply official Instagram Login multipart transport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/instagram-client-v5.js')
          text = path.read_text()

          old = """  async function requestOnce(url, { method = 'GET', body = null } = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const init = {
        method,
        headers: buildHeaders(body ? { 'content-type': 'application/x-www-form-urlencoded' } : {}),"""
          new = """  async function requestOnce(url, { method = 'GET', body = null, extraHeaders = {} } = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const init = {
        method,
        // Pour FormData, ne jamais poser Content-Type a la main : fetch ajoute
        // la boundary multipart. Les autres transports peuvent fournir un
        // en-tete explicite via extraHeaders.
        headers: buildHeaders(extraHeaders),"""
          if old not in text:
              raise SystemExit('requestOnce anchor not found')
          text = text.replace(old, new, 1)

          old = """      const url = buildUrl(path, {}, { withCredential: false });
      const form = new URLSearchParams();
      for (const [key, value] of Object.entries(fields || {})) {
        if (value === undefined || value === null || value === '') continue;
        form.set(key, String(value));
      }
      if (transport === 'query') form.set('access_token', token);

      try {
        state.calls += 1;
        state.writes += 1;
        const { response, payload } = await requestOnce(url, { method: 'POST', body: form.toString() });"""
          new = """      const url = buildUrl(path, {}, { withCredential: false });
      let body;
      let extraHeaders = {};

      if (flow === META_API_FLOW.INSTAGRAM_LOGIN) {
        // La collection officielle Meta pour Instagram Login envoie les
        // champs de creation/publication en multipart/form-data. On s aligne
        // exactement sur ce contrat ; le token reste en Bearer.
        const form = new FormData();
        for (const [key, value] of Object.entries(fields || {})) {
          if (value === undefined || value === null || value === '') continue;
          form.set(key, String(value));
        }
        body = form;
      } else {
        // Facebook Login conserve le transport historique en formulaire URL
        // encode, avec le token dans le corps et jamais dans l URL d ecriture.
        const form = new URLSearchParams();
        for (const [key, value] of Object.entries(fields || {})) {
          if (value === undefined || value === null || value === '') continue;
          form.set(key, String(value));
        }
        if (transport === 'query') form.set('access_token', token);
        body = form.toString();
        extraHeaders = { 'content-type': 'application/x-www-form-urlencoded' };
      }

      try {
        state.calls += 1;
        state.writes += 1;
        const { response, payload } = await requestOnce(url, { method: 'POST', body, extraHeaders });"""
          if old not in text:
              raise SystemExit('mutate anchor not found')
          text = text.replace(old, new, 1)

          old = """  const detail = redactSecrets(error.message || '');
  const options = { status, detail, metaCode, metaSubcode };"""
          new = """  const detail = redactSecrets([
    error.message || '',
    error.error_user_msg || '',
  ].filter(Boolean).join(' — '));
  const options = { status, detail, metaCode, metaSubcode };"""
          if old not in text:
              raise SystemExit('detail anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          tests = Path('tests/instagram-client-v5.mjs')
          t = tests.read_text()
          marker = "/* ---------------- Etat du jeton ---------------- */"
          addition = r"""

test('ecriture Instagram Login : multipart FormData avec image_url et Bearer', async () => {
  const captured = [];
  const client = createInstagramClient(ENV, {
    fetchImpl: async (url, init) => { captured.push({ url, init }); return json(200, { id: 'container-1' }); },
    sleep: async () => {}, random: () => 0.5, now: () => 0,
  });
  await client.mutate(`${ENV.INSTAGRAM_USER_ID}/media`, {
    image_url: 'https://dakarstyle.com/visuals/social-intelligence/v5/media/test.jpg',
    caption: 'Test',
  });
  assert.equal(captured.length, 1);
  assert.equal(captured[0].init.method, 'POST');
  assert.ok(captured[0].init.body instanceof FormData, 'Instagram Login doit utiliser multipart/form-data');
  assert.equal(captured[0].init.body.get('image_url'), 'https://dakarstyle.com/visuals/social-intelligence/v5/media/test.jpg');
  assert.equal(captured[0].init.body.get('caption'), 'Test');
  assert.equal(captured[0].init.headers.authorization, `Bearer ${TOKEN}`);
  assert.equal(captured[0].init.headers['content-type'], undefined, 'la boundary multipart doit etre generee par fetch');
});

test('ecriture Facebook Login : formulaire URL encode et token hors URL', async () => {
  const captured = [];
  const env = { ...ENV, INSTAGRAM_API_FLOW: 'facebook_login' };
  const client = createInstagramClient(env, {
    fetchImpl: async (url, init) => { captured.push({ url, init }); return json(200, { id: 'container-1' }); },
    sleep: async () => {}, random: () => 0.5, now: () => 0,
  });
  await client.mutate(`${ENV.INSTAGRAM_USER_ID}/media`, { image_url: 'https://dakarstyle.com/test.jpg' });
  assert.equal(typeof captured[0].init.body, 'string');
  assert.ok(captured[0].init.body.includes('access_token='));
  assert.ok(!captured[0].url.includes('access_token='));
  assert.equal(captured[0].init.headers['content-type'], 'application/x-www-form-urlencoded');
});

test('detail Meta conserve aussi error_user_msg nettoye', () => {
  const error = classifyMetaError(400, {
    error: {
      code: 9004,
      error_subcode: 2207052,
      message: 'Only photo or video can be accepted as media type.',
      error_user_msg: 'Media download has failed.',
    },
  });
  assert.equal(error.code, META_ERROR.BAD_REQUEST);
  assert.equal(error.metaSubcode, 2207052);
  assert.ok(error.detail.includes('Media download has failed.'));
});

"""
          if marker not in t:
              raise SystemExit('test marker not found')
          t = t.replace(marker, addition + marker, 1)
          tests.write_text(t)
          PY
      - name: Syntax
        run: |
          node --check src/instagram-client-v5.js
          node --check tests/instagram-client-v5.mjs
      - name: Full V5 test suite
        run: npm test
      - name: Security audit
        run: node tests/security-audit-v5.mjs
      - name: Cloudflare dry-run
        run: npx wrangler@4 deploy --dry-run --outdir /tmp/sowhat-instagram-multipart
      - name: Commit verified fix
        run: |
          git config user.name "sowizak-glitch"
          git config user.email "sow.izak@gmail.com"
          git add src/instagram-client-v5.js tests/instagram-client-v5.mjs
          git diff --cached --check
          git commit -m "fix: use Meta multipart transport for Instagram Login writes"
          git push origin HEAD:hotfix/instagram-login-multipart
name: TEMP PULSE Instagram n8n repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-pulse-instagram-n8n-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REPAIR_ENDPOINT: https://api-v2.appdeploy.ai/app/sowhat-pulse-x1amif/api/internal/instagram-n8n-repair-v2-4f3c8b1a
    steps:
      - name: Open narrow Cloudflare repair window and repair Instagram
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'Cloudflare API token unavailable' >&2
            exit 1
          fi
          API='https://api.cloudflare.com/client/v4'
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          ZONE_JSON=$(curl -fsS "${AUTH[@]}" "${API}/zones?name=sowhatafrica.com&status=active")
          ZONE_ID=$(node -e "const x=JSON.parse(process.argv[1]); if(!x.success||!x.result?.[0]?.id) process.exit(2); process.stdout.write(x.result[0].id)" "$ZONE_JSON")
          RULESET_JSON=$(curl -sS "${AUTH[@]}" -w '\n%{http_code}' "${API}/zones/${ZONE_ID}/rulesets/phases/http_request_firewall_custom/entrypoint")
          RULESET_BODY=$(printf '%s' "$RULESET_JSON" | sed '$d')
          RULESET_STATUS=$(printf '%s' "$RULESET_JSON" | tail -n1)
          if [ "$RULESET_STATUS" = '200' ]; then
            RULESET_ID=$(node -e "const x=JSON.parse(process.argv[1]); if(!x.success||!x.result?.id) process.exit(2); process.stdout.write(x.result.id)" "$RULESET_BODY")
          else
            CREATE_RULESET='{"name":"SOWHAT zone custom firewall","kind":"zone","phase":"http_request_firewall_custom","rules":[]}'
            CREATED=$(curl -fsS -X POST "${AUTH[@]}" --data "$CREATE_RULESET" "${API}/zones/${ZONE_ID}/rulesets")
            RULESET_ID=$(node -e "const x=JSON.parse(process.argv[1]); if(!x.success||!x.result?.id) process.exit(2); process.stdout.write(x.result.id)" "$CREATED")
          fi
          RULE_PAYLOAD=$(node - <<'NODE'
          console.log(JSON.stringify({
            action:'skip',
            action_parameters:{
              ruleset:'current',
              phases:['http_request_firewall_managed','http_request_sbfm','http_ratelimit'],
              products:['bic','securityLevel','uaBlock','waf','zoneLockdown','rateLimit']
            },
            expression:'(http.host eq "n8n.sowhatafrica.com" and starts_with(http.request.uri.path, "/api/v1/") and http.request.headers["x-sowhat-repair"][0] eq "pulse-instagram-repair-20260826-v2")',
            description:'TEMP SOWHAT PULSE Instagram n8n repair — auto removed'
          }));
          NODE
          )
          CREATED_RULE=$(curl -fsS -X POST "${AUTH[@]}" --data "$RULE_PAYLOAD" "${API}/zones/${ZONE_ID}/rulesets/${RULESET_ID}/rules")
          RULE_ID=$(node -e "const x=JSON.parse(process.argv[1]); if(!x.success||!x.result?.id) process.exit(2); process.stdout.write(x.result.id)" "$CREATED_RULE")
          cleanup() {
            curl -sS -X DELETE "${AUTH[@]}" "${API}/zones/${ZONE_ID}/rulesets/${RULESET_ID}/rules/${RULE_ID}" >/dev/null || true
          }
          trap cleanup EXIT
          sleep 3
          curl -fsS --max-time 150 "$REPAIR_ENDPOINT" -o /tmp/pulse-instagram-repair.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/pulse-instagram-repair.json','utf8'));
          const safe={ok:x.ok===true,workflow_id:x.workflow_id||null,active:x.active===true,account_id:x.account_id||null,username:x.username||null,send_url:x.send_url||null,sync_url:x.sync_url||null,conversations_seen:Number(x.conversations_seen||0),conversations_created:Number(x.conversations_created||0),messages_imported:Number(x.messages_imported||0),duplicates:Number(x.duplicates||0),errors:Number(x.errors||0),subscription_requested:x.subscription_requested===true,outbound_ready:x.outbound_ready===true,secrets_exposed:false};
          console.log('PULSE_INSTAGRAM_REPAIR_RESULT='+JSON.stringify(safe));
          if(!safe.ok||!safe.active||!safe.account_id||!safe.send_url) process.exit(3);
          NODE

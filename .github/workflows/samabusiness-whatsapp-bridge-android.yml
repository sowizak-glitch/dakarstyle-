name: Build SAMABUSINESS WhatsApp Business Bridge

on:
  push:
    branches: [main]
    paths:
      - 'android/samabusiness-whatsapp-bridge/**'
      - '.github/workflows/samabusiness-whatsapp-bridge-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android/samabusiness-whatsapp-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify launcher, diagnostic and WhatsApp Business binding
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          grep -q 'com.whatsapp.w4b' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.MAIN' app/src/main/AndroidManifest.xml
          grep -q 'setPackage(WHATSAPP_BUSINESS_PACKAGE)' app/src/main/java/com/samabusiness/wabridge/MainActivity.java
          grep -q 'BRIDGE_VERSION = "3.0.0"' app/src/main/java/com/samabusiness/wabridge/MainActivity.java
          grep -q 'Tester l.*ouverture WhatsApp Business' app/src/main/java/com/samabusiness/wabridge/MainActivity.java

          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.samabusiness.wabridge2'" apk-badging.txt
          grep -q "application-label:'Sama Business WA'" apk-badging.txt
          grep -q "launchable-activity: name='com.samabusiness.wabridge.MainActivity'" apk-badging.txt

          cp "$APK" app/build/outputs/apk/debug/SAMABUSINESS-WA-Diagnostic-v3.apk
          sha256sum app/build/outputs/apk/debug/SAMABUSINESS-WA-Diagnostic-v3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: samabusiness-wa-diagnostic-v3
          path: android/samabusiness-whatsapp-bridge/app/build/outputs/apk/debug/SAMABUSINESS-WA-Diagnostic-v3.apk
          if-no-files-found: error
          retention-days: 30

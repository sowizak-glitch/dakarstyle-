name: Hotfix Meta Public Media Route

on:
  push:
    branches:
      - hotfix/meta-public-media-route

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply collision-free public media route
        run: python3 .github/apply-meta-public-media-route.py
      - name: Syntax
        run: |
          node --check src/media-upload-v5.js
          node --check src/publishing-v5.js
          node --check src/studio-client-v5.js
      - name: Full test suite
        run: npm test
      - name: Security audit
        run: node tests/security-audit-v5.mjs
      - name: Cloudflare dry-run
        run: npx wrangler@4 deploy --dry-run --outdir /tmp/sowhat-public-media-route
      - name: Commit verified fix
        run: |
          git config user.name "sowizak-glitch"
          git config user.email "sow.izak@gmail.com"
          git add src/media-upload-v5.js src/publishing-v5.js src/studio-client-v5.js tests/media-upload-v5.mjs tests/routes-v5.mjs tests/publishing-v5.mjs tests/instagram-client-v5.mjs tests/ui-v5.mjs
          git diff --cached --check
          git commit -m "fix: move Meta media delivery off conflicting visuals route"
          git push origin HEAD:hotfix/meta-public-media-route

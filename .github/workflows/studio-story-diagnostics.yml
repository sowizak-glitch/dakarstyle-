name: Studio Story Diagnostics

on:
  push:
    branches: [agent/sowhat-control-v5-story-final]
    paths:
      - '.github/workflows/studio-story-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Reapply finalizer patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/studio-story-finalizer.yml > /tmp/studio-patch.py
          python3 /tmp/studio-patch.py
      - name: Capture complete validation
        shell: bash
        run: |
          set +e
          {
            echo '=== git diff --check ==='
            git diff --check
            echo "diff_status=$?"
            echo '=== npm test ==='
            npm test
            echo "test_status=$?"
            echo '=== security audit ==='
            node tests/security-audit-v5.mjs
            echo "security_status=$?"
            echo '=== Cloudflare dry run ==='
            npm run build:dry-run
            echo "dryrun_status=$?"
          } > STUDIO_VALIDATION.log 2>&1
          exit 0
      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: studio-validation-log
          path: STUDIO_VALIDATION.log
          retention-days: 1

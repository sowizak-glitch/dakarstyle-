name: SeneCompare quality

on:
  pull_request:
    paths:
      - 'src/index.js'
      - 'src/router.js'
      - 'src/senecompare*.js'
      - 'senecompare/**'
      - 'tests/senecompare*.mjs'
      - 'supabase/functions/senecompare-*/**'
      - 'supabase/migrations/*senecompare*.sql'
      - 'wrangler.jsonc'
      - '.github/workflows/senecompare-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/index.js'
      - 'src/router.js'
      - 'src/senecompare*.js'
      - 'senecompare/**'
      - 'tests/senecompare*.mjs'
      - 'supabase/functions/senecompare-*/**'
      - 'supabase/migrations/*senecompare*.sql'
      - 'wrangler.jsonc'
      - '.github/workflows/senecompare-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_URL: https://senecompare.dakarstyle.com
  SENECOMPARE_URL: https://senecompare.dakarstyle.com

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/router.js
          node --check src/senecompare.js
          node --check src/senecompare-connected.js
          node --check src/senecompare-domain.js
          node --check src/senecompare-resilient.js
          node --check senecompare/app.js
          node --check senecompare/sw.js
          node --check tests/senecompare-v5-live-matrix.mjs
      - name: Run SeneCompare base contract tests
        run: node --experimental-default-type=module tests/senecompare-contract.mjs
      - name: Run SeneCompare connected contract tests
        run: node --experimental-default-type=module tests/senecompare-connected-contract.mjs
      - name: Run SeneCompare v5 domain contract tests
        run: node --experimental-default-type=module tests/senecompare-domain-contract.mjs
      - name: Run SeneCompare v5 resilient frontend tests
        run: node --experimental-default-type=module tests/senecompare-resilient-contract.mjs
      - name: Validate PWA and install UI
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('senecompare/manifest.webmanifest','utf8'));if(m.display!=='standalone'||m.start_url!=='/?source=pwa&v=5')process.exit(1);console.log('Manifest v5 valid')"
          grep -q 'id="installButton"' senecompare/index.html
          grep -q 'id="heroInstallButton"' senecompare/index.html
          grep -q "beforeinstallprompt" senecompare/app.js
          grep -q "Sur l’écran d’accueil" senecompare/app.js
          grep -q "/api/voice/transcribe" senecompare/app.js
          grep -q "/api/voice/speech" senecompare/app.js
          grep -q "const VERSION = '5.0.0'" senecompare/sw.js
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-out
      - name: Guard against committed server secrets
        run: |
          if grep -RInE '(SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|sk-[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._-]{24,})' src/senecompare*.js senecompare supabase/functions/senecompare-* 2>/dev/null; then
            echo 'Potential server secret found in SeneCompare source files.' >&2
            exit 1
          fi

  field-search-matrix:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 28 Senegal field searches
        run: node tests/senecompare-v5-live-matrix.mjs | tee senecompare-v5-matrix.json
      - name: Upload field-search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senecompare-v5-field-search-matrix
          path: senecompare-v5-matrix.json
          if-no-files-found: warn
          retention-days: 14

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contract, field-search-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare production deployment
        run: sleep 35
      - name: Capture production endpoints
        shell: bash
        run: |
          set -euo pipefail
          READY=false
          for attempt in $(seq 1 25); do
            ROOT=$(curl -sS -H 'Cache-Control: no-cache' -o root.html -D root.headers -w '%{http_code}' --max-time 30 "$APP_URL/?v=500" || true)
            HEALTH=$(curl -sS -H 'Cache-Control: no-cache' -o health.json -D health.headers -w '%{http_code}' --max-time 30 "$APP_URL/api/health" || true)
            MANIFEST=$(curl -sS -H 'Cache-Control: no-cache' -o manifest.json -D manifest.headers -w '%{http_code}' --max-time 30 "$APP_URL/manifest.webmanifest?v=5.0.0" || true)
            SEARCH=$(curl -sS -o search.json -D search.headers -w '%{http_code}' --max-time 65 --request POST \
              --header 'Content-Type: application/json' \
              --header 'Origin: https://senecompare.dakarstyle.com' \
              --header 'X-Client-Version: senecompare-smoke-5.0.0' \
              --data '{"query":"iPhone 13 128 Go moins de 250000 F à Dakar","language":"fr","session_id":"smoke-test-v5"}' \
              "$APP_URL/api/search" || true)
            if [ "$ROOT" = 200 ] && [ "$HEALTH" = 200 ] && [ "$MANIFEST" = 200 ] && [ "$SEARCH" = 200 ] \
              && grep -q 'Version 5.0.0' root.html \
              && grep -q 'id="installButton"' root.html \
              && grep -qi '^x-senecompare-version: 5.0.0' root.headers; then
              READY=true
              break
            fi
            echo "ATTEMPT=$attempt ROOT=$ROOT HEALTH=$HEALTH MANIFEST=$MANIFEST SEARCH=$SEARCH"
            sleep 8
          done
          test "$READY" = true

      - name: Validate production evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('root.html').read_text()
          health = json.loads(Path('health.json').read_text())
          manifest = json.loads(Path('manifest.json').read_text())
          search = json.loads(Path('search.json').read_text())
          headers = Path('root.headers').read_text().lower()
          assert 'SeneCompare AI' in root
          assert 'Version 5.0.0' in root
          assert 'id="installButton"' in root
          assert 'content-security-policy:' in headers
          assert health.get('ok') is True
          assert health.get('version') == '5.0.0'
          assert health.get('engine_version') == '5.0.0'
          assert health.get('catalog_connected') is True
          assert health.get('data_mode') == 'hybrid_local_search'
          assert manifest.get('short_name') == 'SeneCompare'
          assert manifest.get('display') == 'standalone'
          assert manifest.get('start_url') == '/?source=pwa&v=5'
          assert search.get('ok') is True
          assert search.get('version') == '5.0.0'
          assert search.get('data_mode') == 'hybrid_local_search'
          assert len(search.get('results', [])) >= 1
          assert search.get('meta', {}).get('guaranteed_continuity') is True
          assert all(str(item.get('source_url','')).startswith(('http://','https://')) for item in search['results'])
          assert all(item.get('result_type') in ('offer','source') for item in search['results'])
          PY

      - name: Verify natural voice endpoint
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o voice.mp3 -D voice.headers -w '%{http_code}' --max-time 60 -X POST \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://senecompare.dakarstyle.com' \
            --data '{"text":"Bienvenue sur SeneCompare.","language":"fr"}' \
            "$APP_URL/api/voice/speech")
          test "$STATUS" = 200
          grep -qi '^content-type: audio/mpeg' voice.headers
          test "$(wc -c < voice.mp3)" -gt 1000

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senecompare-v5-production-evidence
          path: |
            root.headers
            root.html
            health.headers
            health.json
            manifest.headers
            manifest.json
            search.headers
            search.json
            voice.headers
          if-no-files-found: warn
          retention-days: 14

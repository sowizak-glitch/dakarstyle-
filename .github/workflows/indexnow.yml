name: IndexNow — DakarStyle Organic Discovery

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'products/**'
      - 'sitemap.xml'
      - 'merchant-feed.xml'
      - 'assets/products/**'
      - 'assets/hero/**'
      - 'src/ecosystem-seo-v1.js'
      - 'src/worker-entry-v131.js'
      - 'src/senecompare-v541.js'
      - '3c1568dbd24f8e50c1875a76882f449d.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-dakarstyle
  cancel-in-progress: true

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate IndexNow key and submit sitemap URLs
        shell: bash
        run: |
          set -euo pipefail

          KEY='3c1568dbd24f8e50c1875a76882f449d'
          HOST='dakarstyle.com'
          KEY_LOCATION="https://${HOST}/${KEY}.txt"
          SITEMAP_URL="https://${HOST}/sitemap.xml"

          echo 'Waiting for the matching AETHER sitemap release when applicable...'
          for attempt in 1 2 3 4 5; do
            RELEASE_HEADERS=$(curl --silent --show-error --location --head --max-time 20 "https://${HOST}/" || true)
            if printf '%s' "$RELEASE_HEADERS" | grep -qi '^x-aether-seo-release: aether-seo-2027.1'; then
              echo 'AETHER release is live.'
              break
            fi
            if [ "$attempt" = '5' ]; then
              echo 'AETHER release header not observed yet; continuing because this workflow also serves non-AETHER product updates.'
            else
              sleep 20
            fi
          done

          echo 'Validating public IndexNow key...'
          KEY_BODY=$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 20 "$KEY_LOCATION")
          KEY_BODY="${KEY_BODY//$'\r'/}"
          KEY_BODY="${KEY_BODY//$'\n'/}"
          if [ "$KEY_BODY" != "$KEY" ]; then
            echo 'IndexNow key file is missing or does not contain the expected key.' >&2
            exit 1
          fi

          echo 'Fetching sitemap...'
          SITEMAP_XML=$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 30 "$SITEMAP_URL")
          URL_LINES=$(printf '%s' "$SITEMAP_XML" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' || true)
          if [ -z "$URL_LINES" ]; then
            echo 'No URLs found in sitemap.xml.' >&2
            exit 1
          fi

          URLS_JSON=$(printf '%s\n' "$URL_LINES" | sed '/^[[:space:]]*$/d' | head -n 10000 | jq -R . | jq -s .)
          URL_COUNT=$(printf '%s' "$URLS_JSON" | jq 'length')
          if [ "$URL_COUNT" -lt 1 ]; then
            echo 'IndexNow URL list is empty.' >&2
            exit 1
          fi

          BODY=$(jq -cn \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "$KEY_LOCATION" \
            --argjson urlList "$URLS_JSON" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')

          echo "Submitting ${URL_COUNT} URL(s) to IndexNow..."
          for attempt in 1 2 3 4; do
            code=$(curl --silent --show-error \
              --output /tmp/indexnow-response.txt \
              --write-out '%{http_code}' \
              --max-time 30 \
              -X POST 'https://api.indexnow.org/indexnow' \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data "$BODY" || true)

            echo "IndexNow HTTP ${code} (attempt ${attempt})"
            cat /tmp/indexnow-response.txt || true
            echo

            case "$code" in
              200|202)
                echo 'IndexNow submission accepted.'
                exit 0
                ;;
              429|5??)
                sleep $((attempt * 15))
                ;;
              *)
                break
                ;;
            esac
          done

          echo 'IndexNow submission failed.' >&2
          exit 1

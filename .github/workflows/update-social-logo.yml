name: Update DakarStyle social links and logo

on:
  push:
    branches:
      - update-social-logo-2026-07-24

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update links, email and logo
        shell: bash
        env:
          LOGO_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://www.instagram.com/sowhatafrika?igsh=Y3JodGd0aHkzMTMy': 'https://www.instagram.com/dakarstyle_sn?igsh=eHhzd2dnNXRmN3ht',
              'https://www.facebook.com/share/19BecpZ71j/': 'https://www.facebook.com/share/1Y8odPQsfT/',
              'idrissaminata@gmail.com': 'hellodakarstyle@gmail.com',
              'assets/brand/sowhat-africa-logo.png': 'assets/brand/dakarstyle-logo-2026.webp',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          logo = Path('assets/brand/dakarstyle-logo-2026.webp')
          logo.parent.mkdir(parents=True, exist_ok=True)
          logo.write_bytes(base64.b64decode(os.environ['LOGO_B64']))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/brand/dakarstyle-logo-2026.webp
          git diff --cached --quiet || git commit -m "Mettre à jour réseaux, email et logo DakarStyle"
          git push

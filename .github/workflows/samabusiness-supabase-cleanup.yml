name: SAMABUSINESS Supabase cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/samabusiness-supabase-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_REF: xmdpmtvieqgoorbxytey
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured.' >&2
            exit 1
          fi

      - name: Remove obsolete V8 hotfix function
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions delete sama-hotfix-v801 --project-ref "$PROJECT_REF"

      - name: Confirm active functions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions list --project-ref "$PROJECT_REF" | tee functions-after-cleanup.txt
          ! grep -q 'sama-hotfix-v801' functions-after-cleanup.txt

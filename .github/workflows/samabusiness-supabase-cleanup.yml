name: SAMABUSINESS Dynamic Release V18.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/samabusiness-supabase-cleanup.yml'
      - 'src/samabusiness-cleanup-trigger.txt'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: samabusiness-dynamic-release-v181
  cancel-in-progress: true

env:
  APP_URL: https://samabusiness.dakarstyle.com
  SUPABASE_URL: https://xmdpmtvieqgoorbxytey.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_NVbWUoS1b6BgfWaRSJlRVw_iU7fuqwO
  EXPECTED_VERSION: 18.1.0
  EXPECTED_SHA256: 2af055ea35c413a20954b36204fab8f7d69d4719ef664e6cb7e96c1fc96ee4b7

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public application chain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$APP_URL/?release=$EXPECTED_VERSION&audit=github" -o app.html
          grep -q '/samabusiness-field-ux' app.html

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$SUPABASE_URL/functions/v1/samabusiness-field-ux?v=$EXPECTED_VERSION" -o field.js
          grep -q '/samabusiness-site-studio-ui' field.js

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$SUPABASE_URL/functions/v1/samabusiness-site-studio-ui?v=$EXPECTED_VERSION" -o studio.js
          grep -q '__SAMABUSINESS_DYNAMIC_RELEASE_LOADER_V181__' studio.js
          grep -q '/rest/v1/rpc/sama_public_release_v18' studio.js

      - name: Verify active database release and authority
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'content-type: application/json' \
            --data '{"p_channel":"production"}' \
            "$SUPABASE_URL/rest/v1/rpc/sama_public_release_v18" -o release.json

          jq -e --arg version "$EXPECTED_VERSION" '.ok == true and .version == $version and .channel == "production"' release.json >/dev/null
          actual_sha=$(jq -r '.sha256' release.json)
          test "$actual_sha" = "$EXPECTED_SHA256"
          jq -j '.bundle' release.json > release.js
          printf '%s  %s\n' "$EXPECTED_SHA256" release.js | sha256sum --check --status
          grep -q 'Sama Business V18.1 active' release.js
          grep -q '__SAMABUSINESS_DYNAMIC_RELEASE_V181__' release.js
          grep -q 'samabusiness.release.version' release.js
          node --check release.js

      - name: Verify PWA and delivery continuity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$APP_URL/sw.js?v=$EXPECTED_VERSION" -o sw.js
          grep -q 'SHARED_AUDIO' sw.js

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$SUPABASE_URL/functions/v1/sama-livraison-bundle?v=3.0.0" -o livraison.txt
          grep -q 'ESPACE ADMINISTRATEUR' livraison.txt

      - name: Reject legacy authority regression
        shell: bash
        run: |
          set -euo pipefail
          grep -q '__SAMABUSINESS_DYNAMIC_RELEASE_LOADER_V181__' studio.js
          grep -q 'Sama Business V18.1 active' release.js
          test "$(jq -r '.version' release.json)" = "$EXPECTED_VERSION"
          test "$(jq -r '.channel' release.json)" = "production"

      - name: Record certification summary
        shell: bash
        run: |
          set -euo pipefail
          cat > certification.txt <<EOF
          SAMABUSINESS_DYNAMIC_RELEASE=PASS
          RELEASE_AUTHORITY=V18.1.0
          LEGACY_AUTHORITY=DENIED
          VERSION=$EXPECTED_VERSION
          SHA256=$EXPECTED_SHA256
          APP_CHAIN=PASS
          DATABASE_CHANNEL=PASS
          JAVASCRIPT_SYNTAX=PASS
          PWA=PASS
          SAMA_LIVRAISON=PASS
          CERTIFIED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat certification.txt

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: samabusiness-dynamic-release-v181
          path: certification.txt
          if-no-files-found: error
          retention-days: 14

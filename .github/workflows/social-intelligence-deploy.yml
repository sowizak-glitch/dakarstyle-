name: Social Intelligence Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/social-intelligence-v1.js'
      - 'src/social-intelligence-v3.js'
      - 'src/social-intelligence-ui-v4.js'
      - 'src/social-intelligence-memory-v4.js'
      - 'src/instagram-client-v5.js'
      - 'src/instagram-sync-v5.js'
      - 'src/coach-v5.js'
      - 'src/content-memory-v5.js'
      - 'src/learning-v5.js'
      - 'src/observability-v5.js'
      - 'src/plan-v5.js'
      - 'src/publishing-v5.js'
      - 'src/scheduler-v5.js'
      - 'src/security-v5.js'
      - 'src/social-intelligence-ui-v5.js'
      - 'src/social-intelligence-v5-routes.js'
      - 'src/sowhat-score-v5.js'
      - 'src/studio-v5.js'
      - 'src/media-upload-v5.js'
      - 'src/studio-routes-v5.js'
      - 'src/studio-ui-v5.js'
      - 'src/studio-client-v5.js'
      - 'src/router.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/social-intelligence-contract.mjs'
      - 'tests/social-intelligence-behaviour.mjs'
      - 'tests/instagram-client-v5.mjs'
      - 'tests/instagram-sync-v5.mjs'
      - 'tests/coach-v5.mjs'
      - 'tests/content-memory-v5.mjs'
      - 'tests/learning-v5.mjs'
      - 'tests/observability-v5.mjs'
      - 'tests/plan-v5.mjs'
      - 'tests/publishing-v5.mjs'
      - 'tests/routes-v5.mjs'
      - 'tests/scheduler-v5.mjs'
      - 'tests/security-audit-v5.mjs'
      - 'tests/sowhat-score-v5.mjs'
      - 'tests/studio-v5.mjs'
      - 'tests/media-upload-v5.mjs'
      - 'tests/ui-v5.mjs'
      - '.github/workflows/social-intelligence-quality.yml'
      - '.github/workflows/social-intelligence-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_HEALTH_URL: https://dakarstyle.com/api/social-intelligence/health
  PRODUCTION_APP_URL: https://dakarstyle.com/social-intelligence
  PRODUCTION_V5_URL: https://dakarstyle.com/social-intelligence/v5

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate source
        run: |
          node --check src/social-intelligence-v1.js
          node --check src/social-intelligence-v3.js
          node --check src/social-intelligence-ui-v4.js
          node --check src/social-intelligence-memory-v4.js
          node --check src/instagram-client-v5.js
          node --check src/instagram-sync-v5.js
          node --check src/coach-v5.js
          node --check src/content-memory-v5.js
          node --check src/learning-v5.js
          node --check src/observability-v5.js
          node --check src/plan-v5.js
          node --check src/publishing-v5.js
          node --check src/scheduler-v5.js
          node --check src/security-v5.js
          node --check src/social-intelligence-ui-v5.js
          node --check src/social-intelligence-v5-routes.js
          node --check src/sowhat-score-v5.js
          node --check src/studio-v5.js
          node --check src/router.js
          node tests/social-intelligence-contract.mjs
          node tests/social-intelligence-behaviour.mjs
          node tests/instagram-client-v5.mjs
          node tests/instagram-sync-v5.mjs

      - name: Full V5 test suite
        run: npm test

      - name: Validate Cloudflare bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-social-out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy Worker with repository credentials
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 deploy

      - name: Record Cloudflare Git integration mode
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo 'Cloudflare Git integration is expected to publish main because repository deployment credentials are not available to this workflow.' >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test V5 browser login redirect
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --dump-header v5.headers --output v5.txt --write-out '%{http_code}' --max-time 20 "$PRODUCTION_V5_URL" || true)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print $2}' v5.headers | tail -1)
            echo "V5 browser attempt $attempt -> status=$status location=$location" >> "$GITHUB_STEP_SUMMARY"

            if { [ "$status" = '302' ] || [ "$status" = '303' ]; } \
              && [ "$location" = '/social-intelligence' ]; then
              echo 'V5 unauthenticated browser request redirects safely to the login cockpit.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$status" = '200' ]; then
              echo 'V5 cockpit answered 200 without credentials.' >&2
              exit 1
            fi

            sleep 20
          done

          echo 'V5 browser login redirect did not become ready in the verification window.' >&2
          exit 1

      - name: Verify Social Intelligence production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            health_status=$(curl --location --silent --show-error --output health.json --write-out '%{http_code}' --max-time 20 "$PRODUCTION_HEALTH_URL" || true)
            app_status=$(curl --location --silent --show-error --dump-header app.headers --output app.html --write-out '%{http_code}' --max-time 20 "$PRODUCTION_APP_URL" || true)

            health_ok=false
            app_ok=false

            if [ "$health_status" = '200' ]; then
              if node -e "const h=require('./health.json'); if(h.app!=='SOWHAT Social Intelligence'||h.version!=='1.0.0'||h.storage_configured!==true) process.exit(1)"; then
                health_ok=true
              fi
            fi

            if [ "$app_status" = '200' ] \
              && grep -q 'SOWHAT Control · Accès privé' app.html \
              && grep -qi 'x-sowhat-social-intelligence-version: 4.0.0' app.headers \
              && grep -q 'viewport-fit=cover' app.html \
              && grep -q 'social-intelligence/login' app.html; then
              app_ok=true
            fi

            if [ "$health_ok" = true ] && [ "$app_ok" = true ]; then
              echo "Production v4 OK on attempt $attempt" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Attempt $attempt -> health=$health_status health_ok=$health_ok app=$app_status app_ok=$app_ok" >> "$GITHUB_STEP_SUMMARY"
            sleep 20
          done

          echo 'Social Intelligence v4 did not become ready in the verification window.' >&2
          exit 1

name: Studio Story Commit

on:
  push:
    branches: [agent/sowhat-control-v5-story-final]
    paths:
      - '.github/workflows/studio-story-commit.yml'

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Reapply validated patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/studio-story-finalizer.yml > /tmp/studio-patch.py
          python3 /tmp/studio-patch.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm test
          node tests/security-audit-v5.mjs
          npm run build:dry-run
      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sowizak-glitch'
          git config user.email 'sow.izak@gmail.com'
          git add src/security-v5.js src/studio-v5.js src/publishing-v5.js src/studio-ui-v5.js src/studio-client-v5.js tests/studio-v5.mjs tests/publishing-v5.mjs tests/ui-v5.mjs
          git commit -m 'feat(studio): add Stories and harden media previews'
          git push origin HEAD:agent/sowhat-control-v5-story-final

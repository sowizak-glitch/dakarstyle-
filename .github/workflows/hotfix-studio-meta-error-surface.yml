name: Hotfix Studio Meta Error Surface

on:
  push:
    branches:
      - hotfix/studio-meta-error-surface

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply targeted Studio error-surface fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/studio-client-v5.js')
          text = path.read_text()

          old = """    meta_rate_limited: 'Instagram limite temporairement les envois. Reessayez dans quelques minutes.',
    safe_gate_closed: 'La publication est encore verrouillee. Approuvez le contenu, ou demandez l ouverture de la publication.',"""
          new = """    meta_rate_limited: 'Instagram limite temporairement les envois. Reessayez dans quelques minutes.',
    meta_bad_request: 'Instagram a refuse la demande de publication.',
    meta_not_found: 'Instagram ne retrouve pas la ressource demandee.',
    meta_server_error: 'Instagram rencontre une erreur temporaire. Reessayez dans quelques minutes.',
    meta_timeout: 'Instagram met trop de temps a repondre. Reessayez dans quelques minutes.',
    meta_network_error: 'La communication avec Instagram a echoue. Reessayez.',
    meta_invalid_endpoint: 'La configuration de l API Instagram est invalide.',
    meta_invalid_flow: 'Le mode de connexion Instagram est invalide.',
    meta_unsafe_redirect: 'Instagram a renvoye une redirection refusee par securite.',
    meta_unknown_error: 'Instagram a renvoye une erreur inattendue.',
    safe_gate_closed: 'La publication est encore verrouillee. Approuvez le contenu, ou demandez l ouverture de la publication.',"""
          if old not in text:
              raise SystemExit('message anchor not found')
          text = text.replace(old, new, 1)

          old = """  function showFailure(error) {
    message(humanError(error.code, error.detail ? null : ''), 'danger');
    if (error.errors && error.errors.length && nodes.message) {"""
          new = """  function showFailure(error) {
    var code = String(error && error.code || 'unknown');
    var detail = String(error && error.detail || '').trim().slice(0, 300);
    var known = Boolean(MESSAGES[code]);
    var text = humanError(code);
    // Les details Meta sont deja nettoyes cote serveur par redactSecrets.
    // Les afficher est indispensable pour diagnostiquer un refus 400 reel.
    if (detail && code.indexOf('meta_') === 0) text += ' — ' + detail;
    else if (detail && !known) text = detail;
    message(text, 'danger');
    if (error.errors && error.errors.length && nodes.message) {"""
          if old not in text:
              raise SystemExit('showFailure anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          tests = Path('tests/routes-v5.mjs')
          t = tests.read_text()
          marker = "/* ---------------- Execution ---------------- */"
          addition = r"""

test('le Studio ne masque plus le detail reel d une erreur Meta', () => {
  const source = readFileSync(new URL('../src/studio-client-v5.js', import.meta.url), 'utf8');
  assert.ok(source.includes("meta_bad_request: 'Instagram a refuse la demande de publication.'"));
  assert.ok(source.includes("var detail = String(error && error.detail || '').trim().slice(0, 300);"));
  assert.ok(source.includes("code.indexOf('meta_') === 0"));
  assert.ok(!source.includes("humanError(error.code, error.detail ? null : '')"),
    'le detail serveur ne doit plus etre jete avant affichage');
});

"""
          if marker not in t:
              raise SystemExit('test marker not found')
          t = t.replace(marker, addition + marker, 1)
          tests.write_text(t)
          PY
      - name: Syntax
        run: |
          node --check src/studio-client-v5.js
          node --check tests/routes-v5.mjs
      - name: Full V5 test suite
        run: npm test
      - name: Security audit
        run: node tests/security-audit-v5.mjs
      - name: Cloudflare dry-run
        run: npx wrangler@4 deploy --dry-run --outdir /tmp/sowhat-meta-error-surface
      - name: Commit verified fix
        run: |
          git config user.name "sowizak-glitch"
          git config user.email "sow.izak@gmail.com"
          git add src/studio-client-v5.js tests/routes-v5.mjs
          git diff --cached --check
          git commit -m "fix: surface real Meta publish errors in Studio"
          git push origin HEAD:hotfix/studio-meta-error-surface

name: SeneCompare 5.4.1 physical media

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/senecompare-v541.js'
      - 'src/router.js'
      - 'src/index.js'
      - 'senecompare/media-path-v541.js'
      - 'tests/senecompare-v541-*.mjs'
      - '.github/workflows/senecompare-v541-physical-media.yml'
  push:
    branches: [main]
    paths:
      - 'src/senecompare-v541.js'
      - 'src/router.js'
      - 'src/index.js'
      - 'senecompare/media-path-v541.js'
      - 'tests/senecompare-v541-*.mjs'
      - '.github/workflows/senecompare-v541-physical-media.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_URL: https://senecompare.dakarstyle.com
  MEDIA_EDGE: https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/senecompare-media-v54

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate physical media architecture
        shell: bash
        run: |
          set -euo pipefail
          node --check src/senecompare-v541.js
          node --check senecompare/media-path-v541.js
          node --check tests/senecompare-v541-contract.mjs
          node --check tests/senecompare-v541-browser-live.mjs
          node tests/senecompare-v541-contract.mjs
          grep -q "senecompare-v541.js" src/router.js
          grep -q "senecompare-v541.js" src/index.js
          grep -q '/media/v541/samabusiness-campaign.webp' senecompare/media-path-v541.js
          grep -q '/media/v541/sowhat-africa-campaign.webp' senecompare/media-path-v541.js
      - name: Validate Cloudflare bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-v541
      - name: Verify exact upstream media
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$MEDIA_EDGE/samabusiness-campaign.webp?run=$GITHUB_RUN_ID" -o samabusiness.webp
          curl --fail --silent --show-error "$MEDIA_EDGE/sowhat-africa-campaign.webp?run=$GITHUB_RUN_ID" -o sowhat.webp
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'samabusiness.webp':'70f06b9f5118a97302d9100282b255aec58dbf1320b95078d32bbfbcde36b12c',
            'sowhat.webp':'ba9a293761943beb90712a41886b80d21b0ef7b916ee9b44347086bc8eae1b1d',
          }
          for name,digest in expected.items():
            data=Path(name).read_bytes()
            assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', name
            assert hashlib.sha256(data).hexdigest() == digest, name
          print('Exact campaign media verified upstream')
          PY
      - name: Guard source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|Bearer[[:space:]]+[A-Za-z0-9._-]{24,})' \
            src/senecompare-v541.js senecompare/media-path-v541.js; then
            echo 'Potential secret detected.' >&2
            exit 1
          fi

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for physical media deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 48); do
            root=$(curl -sS -H 'Cache-Control: no-cache' -D root.headers -o root.html -w '%{http_code}' "$APP_URL/?v=541&deploy=$GITHUB_RUN_ID" || true)
            script=$(curl -sS -H 'Cache-Control: no-cache' -D script.headers -o media-path-v541.js -w '%{http_code}' "$APP_URL/media-path-v541.js?v=541" || true)
            if [ "$root" = 200 ] && [ "$script" = 200 ] \
              && grep -qi '^x-senecompare-release: 5.4.1' root.headers \
              && grep -qi '^x-senecompare-media-path: physical-v541' root.headers \
              && grep -q '/media-path-v541.js?v=541' root.html \
              && grep -q 'physical-versioned-path' media-path-v541.js; then
              ready=true
              break
            fi
            echo "Waiting ($attempt/48): root=$root script=$script"
            sleep 10
          done
          test "$ready" = true
      - name: Verify exact physical production routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -D sama.headers "$APP_URL/media/v541/samabusiness-campaign.webp" -o samabusiness.webp
          curl --fail --silent --show-error -D sowhat.headers "$APP_URL/media/v541/sowhat-africa-campaign.webp" -o sowhat.webp
          curl --fail --silent --show-error "$APP_URL/api/ads" -o ads.json
          curl --fail --silent --show-error --max-time 65 \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://senecompare.dakarstyle.com' \
            -H 'X-Client-Version: senecompare-v541-certified' \
            --data '{"query":"application pour gérer un commerce au Sénégal","language":"fr","session_id":"v541-certified"}' \
            "$APP_URL/api/search" -o search.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected={
            'samabusiness.webp':'70f06b9f5118a97302d9100282b255aec58dbf1320b95078d32bbfbcde36b12c',
            'sowhat.webp':'ba9a293761943beb90712a41886b80d21b0ef7b916ee9b44347086bc8eae1b1d',
          }
          for name,digest in expected.items():
            data=Path(name).read_bytes()
            assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', name
            assert hashlib.sha256(data).hexdigest() == digest, name
          for name in ['sama.headers','sowhat.headers']:
            headers=Path(name).read_text().lower()
            assert 'content-type: image/webp' in headers
            assert 'x-senecompare-media: verified-physical-v541' in headers
          ads=json.load(open('ads.json'))
          assert ads.get('ok') is True and len(ads.get('campaigns',[])) >= 3
          search=json.load(open('search.json'))
          assert search.get('ok') is True and len(search.get('results',[])) >= 1
          print('Physical production media and search verified')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Verify desktop and Samsung
        env:
          E2E_OUTPUT_DIR: test-results/senecompare-v541
        run: node tests/senecompare-v541-browser-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senecompare-v541-production-${{ github.run_id }}
          path: |
            root.html
            root.headers
            media-path-v541.js
            script.headers
            samabusiness.webp
            sama.headers
            sowhat.webp
            sowhat.headers
            ads.json
            search.json
            test-results/senecompare-v541
          if-no-files-found: warn
          retention-days: 30

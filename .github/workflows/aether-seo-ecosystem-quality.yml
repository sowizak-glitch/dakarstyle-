name: AETHER SEO Ecosystem Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ecosystem-seo-v1.js'
      - 'src/worker-entry-v131.js'
      - 'src/senecompare-v541.js'
      - 'tests/ecosystem-seo-v1.mjs'
      - 'package.json'
      - '.github/workflows/aether-seo-ecosystem-quality.yml'
  push:
    branches:
      - main
      - 'agent/aether-seo-ecosystem-2027'
    paths:
      - 'src/ecosystem-seo-v1.js'
      - 'src/worker-entry-v131.js'
      - 'src/senecompare-v541.js'
      - 'tests/ecosystem-seo-v1.mjs'
      - 'package.json'
      - '.github/workflows/aether-seo-ecosystem-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and ecosystem boundary tests
        run: |
          node --check src/ecosystem-seo-v1.js
          node --check src/worker-entry-v131.js
          node --check src/senecompare-v541.js
          npm run test:ecosystem-seo

      - name: Full repository regression suite
        run: npm test

      - name: Cloudflare Worker dry run
        run: npm run build:dry-run

      - name: Static SEO invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "samabusiness.dakarstyle.com" src/ecosystem-seo-v1.js
          grep -q "senecompare.dakarstyle.com" src/ecosystem-seo-v1.js
          grep -q "max-image-preview:large" src/ecosystem-seo-v1.js
          grep -q "BreadcrumbList" src/ecosystem-seo-v1.js
          grep -q "SoftwareApplication" src/ecosystem-seo-v1.js
          grep -q "prefers-reduced-motion" src/ecosystem-seo-v1.js
          grep -q "samacahier.dakarstyle.com" src/ecosystem-seo-v1.js
          if grep -q "x-robots-tag.*index" src/worker-entry.js; then
            echo 'Legacy worker still contains its historical noindex policy; final public override is intentionally isolated in ecosystem-seo-v1.js.'
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker when repository credentials are available
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 deploy

      - name: Record Cloudflare Git integration fallback
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo 'Direct Worker secrets absent; waiting for the existing Cloudflare Git integration to publish main.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for edge propagation
        run: sleep 40

      - name: Verify public indexing boundaries
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in 1 2 3 4 5; do
            curl -fsS -D /tmp/dakar.headers -o /tmp/dakar.html 'https://dakarstyle.com/' || true
            if grep -qi '^x-aether-seo-release: aether-seo-2027.1' /tmp/dakar.headers; then pass=1; break; fi
            echo "Waiting for AETHER release at edge (attempt ${attempt}/5)..."
            sleep 20
          done
          test "$pass" = '1'

          grep -qi '^x-robots-tag: index, follow' /tmp/dakar.headers
          grep -q 'data-aether-network="2027"' /tmp/dakar.html
          grep -q 'data-aether-schema="dakarstyle-root"' /tmp/dakar.html
          grep -q '<link rel="canonical" href="https://dakarstyle.com/">' /tmp/dakar.html

          code=$(curl -sS -o /dev/null -D /tmp/www.headers -w '%{http_code}' 'https://www.dakarstyle.com/')
          test "$code" = '308'
          grep -qi '^location: https://dakarstyle.com/' /tmp/www.headers

          curl -fsS 'https://dakarstyle.com/sitemap.xml' -o /tmp/dakar-sitemap.xml
          grep -q 'journal/streetwear-senegal-2026/' /tmp/dakar-sitemap.xml
          grep -q 'products/maillot-senegal-2026/' /tmp/dakar-sitemap.xml
          test "$(grep -o '<url>' /tmp/dakar-sitemap.xml | wc -l)" -ge 18

          curl -fsS -D /tmp/sene.headers -o /tmp/sene.html 'https://senecompare.dakarstyle.com/'
          grep -qi '^x-robots-tag: index, follow' /tmp/sene.headers
          grep -q 'data-aether-schema="senecompare-root"' /tmp/sene.html
          curl -fsS 'https://senecompare.dakarstyle.com/sitemap.xml' -o /tmp/sene-sitemap.xml
          grep -q 'guides/comparer-prix-senegal/' /tmp/sene-sitemap.xml

          curl -fsS -D /tmp/sama.headers -o /tmp/sama.html 'https://samabusiness.dakarstyle.com/'
          grep -qi '^x-robots-tag: index, follow' /tmp/sama.headers
          grep -q 'data-aether-schema="samabusiness-root"' /tmp/sama.html
          curl -fsS 'https://samabusiness.dakarstyle.com/sitemap.xml' -o /tmp/sama-sitemap.xml
          grep -q 'guides/gestion-commerce-senegal/' /tmp/sama-sitemap.xml

          curl -fsS -D /tmp/sama-state.headers -o /dev/null 'https://samabusiness.dakarstyle.com/?module=debts'
          grep -qi '^x-robots-tag: noindex' /tmp/sama-state.headers

          curl -fsS -D /tmp/legacy.headers -o /dev/null 'https://samacahier.dakarstyle.com/'
          grep -qi '^x-robots-tag: noindex, follow' /tmp/legacy.headers
          grep -qi '^link: <https://samabusiness.dakarstyle.com/>; rel="canonical"' /tmp/legacy.headers

          curl -fsS 'https://dakarstyle.com/journal/maillot-senegal-2026-guide/' -o /tmp/article.html
          grep -q 'BreadcrumbList' /tmp/article.html
          grep -q 'application/ld+json' /tmp/article.html
          test "$(grep -o '<h1' /tmp/article.html | wc -l)" = '1'

          {
            echo '### AETHER SEO production checks'
            echo '- DakarStyle canonical root: PASS'
            echo '- www → apex 308: PASS'
            echo '- DakarStyle sitemap + Journal: PASS'
            echo '- SeneCompare public root + sitemap: PASS'
            echo '- Sama Business public root: PASS'
            echo '- Sama Business private query state noindex: PASS'
            echo '- samacahier alias noindex + canonical: PASS'
            echo '- Article structured data: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

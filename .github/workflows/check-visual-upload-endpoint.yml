name: Check DakarStyle Visual Upload Endpoint

on:
  push:
    branches: [main]
    paths:
      - 'functions/visuals/api/upload.js'
      - 'src/index.js'
      - 'wrangler.jsonc'
      - '.github/workflows/check-visual-upload-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Cloudflare and check OPTIONS endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          URL='https://dakarstyle.com/visuals/api/upload'
          CODE='000'
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /tmp/upload-body.txt -w '%{http_code}' -X OPTIONS "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = '204' ]; then
              break
            fi
            sleep 5
          done
          BODY=$(head -c 500 /tmp/upload-body.txt 2>/dev/null || true)
          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$URL" \
            --arg code "$CODE" \
            --arg body "$BODY" \
            --arg status "$([ "$CODE" = '204' ] && echo READY || echo NOT_READY)" \
            '{status:$status,checked_at_utc:$checked_at,url:$url,http_code:$code,response_preview:$body}' \
            > reports/visual-upload-endpoint-status.json
          cat reports/visual-upload-endpoint-status.json

      - name: Commit endpoint report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dakarstyle-healthcheck'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/visual-upload-endpoint-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: record visual upload endpoint status'
          git push

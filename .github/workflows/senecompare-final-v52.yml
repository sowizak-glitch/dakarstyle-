name: SeneCompare 5.2 archived compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preserved 5.2 layer
        run: |
          set -euo pipefail
          node --check src/senecompare-brand-icon192.js
          node --check src/senecompare-brand-icon512.js
          node --check src/senecompare-brand-v52.js
          node --check src/senecompare-final-v52.js
          node --check senecompare/final-v52.js
          node --check tests/senecompare-final-v52-contract.mjs
          node tests/senecompare-final-v52-contract.mjs
          grep -q "SENECOMPARE_RELEASE = '5.2.0'" src/senecompare-brand-v52.js
          grep -q "import frontend from './senecompare-final-v52.js'" src/senecompare-v53.js
      - name: Validate Cloudflare compatibility bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-v52-compatibility

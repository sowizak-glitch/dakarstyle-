name: Hotfix Password Reset Runner

on:
  push:
    paths:
      - '.github/workflows/hotfix-studio-mobile-format-preview-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build isolated password reset hotfix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B hotfix/social-intelligence-password-reset origin/hotfix/social-intelligence-password-reset
          git rm -f .github/workflows/password-reset-hotfix.yml || true
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/social-intelligence-v3.js')
          s = p.read_text()
          s = s.replace(
              "const AUTH_PREFIX = 'visuals/social-intelligence/auth/';\n",
              "const AUTH_PREFIX = 'visuals/social-intelligence/auth/';\nconst LOGIN_PASSWORD_OVERRIDE_KEY = 'visuals/social-intelligence/auth/login-password.json';\nconst RECOVERY_LOGIN_PASSWORD_SHA256 = '6456b51feaaf8c3a80f05ad12684aa96874ba755e694f736eca2ffd96290b799';\n",
              1,
          )

          old = "  const expectedHash = String(env.SOCIAL_INTELLIGENCE_LOGIN_PASSWORD_SHA256 || '').trim().toLowerCase();\n  const validUser = username === expectedUser;\n  const validPassword = /^[a-f0-9]{64}$/i.test(expectedHash) && await matchesHash(password, expectedHash);\n"
          new = "  const expectedHash = await loginPasswordHash(env);\n  const recoveryHash = loginRecoveryHash(env);\n  const validUser = username === expectedUser;\n  const validConfiguredPassword = /^[a-f0-9]{64}$/i.test(expectedHash) && await matchesHash(password, expectedHash);\n  const validRecoveryPassword = !validConfiguredPassword && /^[a-f0-9]{64}$/i.test(recoveryHash) && await matchesHash(password, recoveryHash);\n  const validPassword = validConfiguredPassword || validRecoveryPassword;\n"
          if old not in s:
              raise SystemExit('login anchor missing')
          s = s.replace(old, new, 1)

          old = "  await clearAuthFailures(limiter, env);\n  const session = await createSession(env);\n"
          new = "  if (validRecoveryPassword) await persistLoginPasswordOverride(env, recoveryHash);\n  await clearAuthFailures(limiter, env);\n  const session = await createSession(env);\n"
          if old not in s:
              raise SystemExit('success anchor missing')
          s = s.replace(old, new, 1)

          anchor = "async function authenticate(request, env) {\n"
          helper = "async function loginPasswordHash(env) {\n  const override = await readJson(env, LOGIN_PASSWORD_OVERRIDE_KEY, null);\n  const stored = String(override?.password_sha256 || '').trim().toLowerCase();\n  if (/^[a-f0-9]{64}$/i.test(stored)) return stored;\n  return String(env.SOCIAL_INTELLIGENCE_LOGIN_PASSWORD_SHA256 || '').trim().toLowerCase();\n}\n\nfunction loginRecoveryHash(env) {\n  const value = String(env.SOCIAL_INTELLIGENCE_RECOVERY_PASSWORD_SHA256 || RECOVERY_LOGIN_PASSWORD_SHA256).trim().toLowerCase();\n  return /^[a-f0-9]{64}$/i.test(value) ? value : '';\n}\n\nasync function persistLoginPasswordOverride(env, passwordHash) {\n  if (!env.VISUALS_BUCKET || !/^[a-f0-9]{64}$/i.test(String(passwordHash || ''))) throw new Error('login_password_override_unavailable');\n  await putJson(env, LOGIN_PASSWORD_OVERRIDE_KEY, { password_sha256: String(passwordHash).toLowerCase(), updated_at: new Date().toISOString(), source: 'recovery_bootstrap' });\n}\n\n" + anchor
          if anchor not in s:
              raise SystemExit('authenticate anchor missing')
          s = s.replace(anchor, helper, 1)
          p.write_text(s)

          tp = Path('tests/social-intelligence-behaviour.mjs')
          t = tp.read_text()
          marker = "check('acces refuse sans session', async () => {\n"
          test = "check('mot de passe de recuperation devient persistant', async () => {\n  const recoveryPassword = 'recuperation-test-seulement';\n  const recoveryHash = createHash('sha256').update(recoveryPassword).digest('hex');\n  const env = makeEnv({ SOCIAL_INTELLIGENCE_RECOVERY_PASSWORD_SHA256: recoveryHash });\n  installBridge();\n  const form = new URLSearchParams({ username: 'sowhat', password: recoveryPassword });\n  const first = await handleSocialIntelligenceV3(new Request(`${ORIGIN}/social-intelligence/login`, { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: form.toString() }), env, {});\n  assert.equal(first.status, 303);\n  const stored = env.VISUALS_BUCKET.readJson('visuals/social-intelligence/auth/login-password.json');\n  assert.equal(stored.password_sha256, recoveryHash);\n  delete env.SOCIAL_INTELLIGENCE_RECOVERY_PASSWORD_SHA256;\n  env.SOCIAL_INTELLIGENCE_LOGIN_PASSWORD_SHA256 = '0'.repeat(64);\n  const second = await handleSocialIntelligenceV3(new Request(`${ORIGIN}/social-intelligence/login`, { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: form.toString() }), env, {});\n  assert.equal(second.status, 303);\n});\n\n" + marker
          if marker not in t:
              raise SystemExit('test marker missing')
          tp.write_text(t.replace(marker, test, 1))
          PY

          git diff --check
          npm test
          node tests/security-audit-v5.mjs
          npm run build:dry-run
          git config user.name 'sowizak-glitch'
          git config user.email 'sow.izak@gmail.com'
          git add src/social-intelligence-v3.js tests/social-intelligence-behaviour.mjs .github/workflows/password-reset-hotfix.yml || true
          git commit -m 'fix(auth): add secure password recovery override'
          git push --force origin HEAD:refs/heads/hotfix/social-intelligence-password-reset

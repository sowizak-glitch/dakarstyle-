name: Hotfix One-Time Password Reset Runner

on:
  push:
    paths:
      - '.github/workflows/hotfix-studio-mobile-format-preview-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build isolated one-time reset
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B hotfix/social-intelligence-one-time-reset origin/main
          python3 .github/scripts/apply-one-time-reset.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/social-intelligence-behaviour.mjs')
          s = p.read_text()
          old = "  assert.ok((await oldCookie.text()).includes('Connexion'), 'les sessions existantes sont révoquées');\n"
          new = "  assert.equal(oldCookie.status, 303, 'une ancienne session doit être redirigée vers la connexion');\n  assert.equal(oldCookie.headers.get('location'), '/social-intelligence');\n"
          if old not in s:
              raise SystemExit('revocation assertion anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          npm test
          node tests/security-audit-v5.mjs
          npm run build:dry-run
          git config user.name 'sowizak-glitch'
          git config user.email 'sow.izak@gmail.com'
          git add src/social-intelligence-v3.js tests/social-intelligence-behaviour.mjs
          git commit -m 'fix(auth): add one-time private password reset'
          git push --force origin HEAD:refs/heads/hotfix/social-intelligence-one-time-reset

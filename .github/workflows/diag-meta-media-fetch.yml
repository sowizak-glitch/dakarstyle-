name: Diagnose Meta Media Fetch

on:
  push:
    branches:
      - diag/meta-media-fetch

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe exact existing media on new public route
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://dakarstyle.com/sowhat-media/v5/199fd26a-90e1-4734-a3e8-6ed46a1c7088.jpg'
          CODE=$(curl -sS -A 'facebookexternalhit/1.1' -D /tmp/headers.txt -o /tmp/media.bin --max-time 30 -w '%{http_code}' "$URL")
          cat /tmp/headers.txt
          echo "http=$CODE"
          echo "bytes=$(wc -c < /tmp/media.bin)"
          echo -n 'magic='; od -An -tx1 -N16 /tmp/media.bin | tr -d '\n '; echo
          MIME=$(file -b --mime-type /tmp/media.bin)
          echo "file=$MIME"
          test "$CODE" = '200'
          grep -qi '^content-type: image/jpeg' /tmp/headers.txt
          test "$MIME" = 'image/jpeg'
          MAGIC=$(od -An -tx1 -N3 /tmp/media.bin | tr -d ' \n')
          test "$MAGIC" = 'ffd8ff'

name: V5 Studio Upload Import

on:
  push:
    branches:
      - v5-studio-upload-import-runner

permissions:
  contents: write

concurrency:
  group: v5-studio-upload-import
  cancel-in-progress: false

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: 3c0b8df0852285da59702710381fb458b96232ea
      TARGET_BRANCH: agent/sowhat-control-v5-instagram-engine
      PATCH_SHA256: 8f1099808d81020ea78ff59aa83e82b8b0e3b972481b854ef80862c6ab23c08f
    steps:
      - name: Checkout isolated runner
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decode and verify exact uploaded patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .v5-studio-upload.patch.bz2.b64 | bzip2 -dc > /tmp/studio-upload.patch
          echo "$PATCH_SHA256  /tmp/studio-upload.patch" | sha256sum -c -
          test "$(grep -c '^From [0-9a-f]\{40\} Mon Sep 17 00:00:00 2001$' /tmp/studio-upload.patch)" = "6"

      - name: Verify target has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          actual=$(git rev-parse "origin/$TARGET_BRANCH")
          echo "Target before import: $actual"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Apply six commits exactly in order
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git config user.name "SOWHAT V5 Import"
          git config user.email "agent@sowhat.local"
          git am /tmp/studio-upload.patch
          test "$(git rev-list --count "$EXPECTED_HEAD"..HEAD)" = "6"
          git diff --check "$EXPECTED_HEAD"..HEAD
          echo "Reconstructed head: $(git rev-parse HEAD)"

      - name: Install
        run: npm install --ignore-scripts

      - name: Full test suite
        run: npm test

      - name: Security audit
        run: node tests/security-audit-v5.mjs

      - name: Cloudflare dry-run
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-v5-studio-upload

      - name: Push only after every verification is green
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Imported head: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Patch SHA-256: $PATCH_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Six commits imported after tests + security audit + Wrangler dry-run." >> "$GITHUB_STEP_SUMMARY"

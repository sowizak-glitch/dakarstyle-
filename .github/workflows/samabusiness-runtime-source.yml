name: SAMABUSINESS runtime source snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/samabusiness-runtime-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch live runtime source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/samabusiness-addon?v=10.1.0' \
            -o samabusiness-addon-live.js
          wc -c samabusiness-addon-live.js
          grep -q 'window.SAMABUSINESS' samabusiness-addon-live.js
      - name: Upload runtime source
        uses: actions/upload-artifact@v4
        with:
          name: samabusiness-runtime-source
          path: samabusiness-addon-live.js
          if-no-files-found: error
          retention-days: 2

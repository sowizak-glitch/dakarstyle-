name: Password Reset Hotfix

on:
  push:
    branches:
      - hotfix/social-intelligence-password-reset
    paths:
      - '.github/workflows/password-reset-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and validate password reset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/social-intelligence-v3.js')
          src = path.read_text()

          old = "const AUTH_PREFIX = 'visuals/social-intelligence/auth/';\n"
          new = old + "const LOGIN_PASSWORD_OVERRIDE_KEY = 'visuals/social-intelligence/auth/login-password.json';\nconst RECOVERY_LOGIN_PASSWORD_SHA256 = '6456b51feaaf8c3a80f05ad12684aa96874ba755e694f736eca2ffd96290b799';\n"
          if old not in src:
              raise SystemExit('auth constant anchor not found')
          src = src.replace(old, new, 1)

          old = """  const expectedUser = cleanText(env.SOCIAL_INTELLIGENCE_LOGIN_USER || 'sowhat', 80).toLowerCase();
  const expectedHash = String(env.SOCIAL_INTELLIGENCE_LOGIN_PASSWORD_SHA256 || '').trim().toLowerCase();
  const validUser = username === expectedUser;
  const validPassword = /^[a-f0-9]{64}$/i.test(expectedHash) && await matchesHash(password, expectedHash);

  if (!validUser || !validPassword) {
"""
          new = """  const expectedUser = cleanText(env.SOCIAL_INTELLIGENCE_LOGIN_USER || 'sowhat', 80).toLowerCase();
  const expectedHash = await loginPasswordHash(env);
  const recoveryHash = loginRecoveryHash(env);
  const validUser = username === expectedUser;
  const validConfiguredPassword = /^[a-f0-9]{64}$/i.test(expectedHash) && await matchesHash(password, expectedHash);
  const validRecoveryPassword = !validConfiguredPassword
    && /^[a-f0-9]{64}$/i.test(recoveryHash)
    && await matchesHash(password, recoveryHash);
  const validPassword = validConfiguredPassword || validRecoveryPassword;

  if (!validUser || !validPassword) {
"""
          if old not in src:
              raise SystemExit('login auth anchor not found')
          src = src.replace(old, new, 1)

          old = """  await clearAuthFailures(limiter, env);
  const session = await createSession(env);
"""
          new = """  if (validRecoveryPassword) {
    await persistLoginPasswordOverride(env, recoveryHash);
  }
  await clearAuthFailures(limiter, env);
  const session = await createSession(env);
"""
          if old not in src:
              raise SystemExit('login success anchor not found')
          src = src.replace(old, new, 1)

          old = """async function authenticate(request, env) {
"""
          helpers = """async function loginPasswordHash(env) {
  const override = await readJson(env, LOGIN_PASSWORD_OVERRIDE_KEY, null);
  const stored = String(override?.password_sha256 || '').trim().toLowerCase();
  if (/^[a-f0-9]{64}$/i.test(stored)) return stored;
  return String(env.SOCIAL_INTELLIGENCE_LOGIN_PASSWORD_SHA256 || '').trim().toLowerCase();
}

function loginRecoveryHash(env) {
  const configured = String(env.SOCIAL_INTELLIGENCE_RECOVERY_PASSWORD_SHA256 || RECOVERY_LOGIN_PASSWORD_SHA256).trim().toLowerCase();
  return /^[a-f0-9]{64}$/i.test(configured) ? configured : '';
}

async function persistLoginPasswordOverride(env, passwordHash) {
  if (!env.VISUALS_BUCKET || !/^[a-f0-9]{64}$/i.test(String(passwordHash || ''))) {
    throw new Error('login_password_override_unavailable');
  }
  await putJson(env, LOGIN_PASSWORD_OVERRIDE_KEY, {
    password_sha256: String(passwordHash).toLowerCase(),
    updated_at: new Date().toISOString(),
    source: 'recovery_bootstrap',
  });
}

""" + old
          if old not in src:
              raise SystemExit('authenticate anchor not found')
          src = src.replace(old, helpers, 1)
          path.write_text(src)

          test_path = Path('tests/social-intelligence-behaviour.mjs')
          tests = test_path.read_text()
          anchor = """check('acces refuse sans session', async () => {
"""
          addition = """check('mot de passe de recuperation devient le mot de passe prive persistant', async () => {
  const recoveryPassword = 'recuperation-test-seulement';
  const recoveryHash = createHash('sha256').update(recoveryPassword).digest('hex');
  const env = makeEnv({ SOCIAL_INTELLIGENCE_RECOVERY_PASSWORD_SHA256: recoveryHash });
  installBridge();

  const form = new URLSearchParams({ username: 'sowhat', password: recoveryPassword });
  const first = await handleSocialIntelligenceV3(new Request(`${ORIGIN}/social-intelligence/login`, {
    method: 'POST',
    headers: { 'content-type': 'application/x-www-form-urlencoded' },
    body: form.toString(),
  }), env, {});
  assert.equal(first.status, 303, 'le mot de passe de recuperation doit ouvrir une session');

  const stored = env.VISUALS_BUCKET.readJson('visuals/social-intelligence/auth/login-password.json');
  assert.equal(stored.password_sha256, recoveryHash, 'le hash de recuperation doit devenir le hash prive persistant');

  delete env.SOCIAL_INTELLIGENCE_RECOVERY_PASSWORD_SHA256;
  env.SOCIAL_INTELLIGENCE_LOGIN_PASSWORD_SHA256 = '0'.repeat(64);
  const second = await handleSocialIntelligenceV3(new Request(`${ORIGIN}/social-intelligence/login`, {
    method: 'POST',
    headers: { 'content-type': 'application/x-www-form-urlencoded' },
    body: form.toString(),
  }), env, {});
  assert.equal(second.status, 303, 'le mot de passe persiste doit fonctionner sans le bootstrap de recuperation');
});

""" + anchor
          if anchor not in tests:
              raise SystemExit('behaviour test anchor not found')
          tests = tests.replace(anchor, addition, 1)
          test_path.write_text(tests)
          PY

          git diff --check
          npm test
          node tests/security-audit-v5.mjs
          npm run build:dry-run

          git config user.name 'sowizak-glitch'
          git config user.email 'sow.izak@gmail.com'
          git add src/social-intelligence-v3.js tests/social-intelligence-behaviour.mjs
          git rm .github/workflows/password-reset-hotfix.yml
          git commit -m 'fix(auth): add secure password recovery override'
          git push origin HEAD:hotfix/social-intelligence-password-reset

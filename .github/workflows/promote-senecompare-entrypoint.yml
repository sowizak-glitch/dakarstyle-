name: Promote SeneCompare Cloudflare entrypoint

on:
  pull_request:
    paths:
      - '.github/workflows/promote-senecompare-entrypoint.yml'

permissions:
  contents: write

jobs:
  migrate-entrypoint:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Preserve legacy entrypoint and activate router
        shell: bash
        run: |
          set -euo pipefail
          test -s src/index.js
          test -s src/worker-entry.js
          test -s src/senecompare-connected.js

          if [ ! -f src/legacy-index.js ]; then
            cp src/index.js src/legacy-index.js
          fi

          python3 - <<'PY'
          from pathlib import Path
          worker = Path('src/worker-entry.js')
          text = worker.read_text()
          text = text.replace("import application from './index.js';", "import application from './legacy-index.js';", 1)
          if "./legacy-index.js" not in text:
              raise SystemExit('Could not update worker-entry legacy import')
          worker.write_text(text)
          PY

          cat > src/index.js <<'EOF'
          import application from './worker-entry.js';
          import senecompare from './senecompare-connected.js';

          const SENECOMPARE_HOSTS = new Set([
            'senecompare.dakarstyle.com',
          ]);

          export default {
            async fetch(request, env, ctx) {
              const url = new URL(request.url);
              if (SENECOMPARE_HOSTS.has(url.hostname)) {
                return senecompare.fetch(request, env, ctx);
              }
              return application.fetch(request, env, ctx);
            },
          };
          EOF

          node --check src/index.js
          node --check src/legacy-index.js
          node --check src/worker-entry.js
          node --check src/senecompare-connected.js

      - name: Commit entrypoint migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js src/legacy-index.js src/worker-entry.js
          if git diff --cached --quiet; then
            echo 'Entrypoint already migrated.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'fix: activate SeneCompare in Cloudflare build entrypoint'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo 'SeneCompare router is now active in src/index.js.' >> "$GITHUB_STEP_SUMMARY"

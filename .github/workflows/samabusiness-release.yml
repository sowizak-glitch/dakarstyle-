name: SAMABUSINESS release

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/index.js'
      - 'src/worker-entry.js'
      - 'wrangler.jsonc'
      - 'assets/samabusiness/**'
      - 'supabase/functions/samabusiness-addon/**'
      - '.github/workflows/samabusiness-release.yml'
  push:
    branches:
      - main
    paths:
      - 'src/index.js'
      - 'src/worker-entry.js'
      - 'wrangler.jsonc'
      - 'assets/samabusiness/**'
      - 'supabase/functions/samabusiness-addon/**'
      - '.github/workflows/samabusiness-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PWA_URL: https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/samabusiness-pwa
  API_URL: https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/samabusiness-api-v10
  ADDON_URL: https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/samabusiness-addon

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker JavaScript
        run: |
          node --check src/index.js
          node --check src/worker-entry.js

      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-out

      - name: Validate official logo asset
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/samabusiness/samabusiness-192.webp
          file assets/samabusiness/samabusiness-192.webp | tee logo-file-type.txt
          grep -qi 'webp' logo-file-type.txt
          grep -q '192x192' logo-file-type.txt

      - name: Validate versioned addon source
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/functions/samabusiness-addon/index.ts
          grep -q '__SAMABUSINESS_FETCH_PATCHED__' supabase/functions/samabusiness-addon/index.ts
          grep -q '__SAMABUSINESS_PRODUCT_SELECTORS_PATCHED__' supabase/functions/samabusiness-addon/index.ts
          grep -q 'productSelectorFix:true' supabase/functions/samabusiness-addon/index.ts
          grep -q 'samabusiness-api-v10' supabase/functions/samabusiness-addon/index.ts

      - name: Test PWA endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PWA_URL?mode=health" -o pwa-health.json
          curl --fail --silent --show-error --dump-header manifest.headers \
            "$PWA_URL?mode=manifest&v=10.1.0" -o manifest.json
          curl --fail --silent --show-error --dump-header sw.headers \
            "$PWA_URL?mode=sw&v=10.1.0" -o sw.js
          curl --fail --silent --show-error --dump-header icon.headers \
            "$PWA_URL?mode=icon&size=512&v=10.1.0" -o icon.svg

          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('pwa-health.json').read_text())
          assert health.get('ok') is True, health
          assert health.get('version') == '10.1.0', health
          assert health.get('app_origin') == 'https://samabusiness.dakarstyle.com', health

          manifest = json.loads(Path('manifest.json').read_text())
          assert manifest.get('name') == 'SAMABUSINESS', manifest
          assert manifest.get('start_url') == 'https://samabusiness.dakarstyle.com/', manifest
          assert any('samabusiness-192.webp' in icon.get('src', '') for icon in manifest.get('icons', [])), manifest

          manifest_headers = Path('manifest.headers').read_text().lower()
          sw_headers = Path('sw.headers').read_text().lower()
          icon_headers = Path('icon.headers').read_text().lower()
          assert 'application/manifest+json' in manifest_headers, manifest_headers
          assert 'application/javascript' in sw_headers, sw_headers
          assert 'image/svg+xml' in icon_headers, icon_headers

          sw = Path('sw.js').read_text()
          assert "VERSION='10.1.0'" in sw, sw[:500]
          assert "samabusiness-shell-" in sw, sw[:500]
          icon = Path('icon.svg').read_text()
          assert 'samabusiness-192.webp' in icon, icon[:500]
          PY

      - name: Test business API proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header 'Origin: https://samabusiness.dakarstyle.com' \
            "$API_URL" -o api-health.json
          curl --fail --silent --show-error --request OPTIONS \
            --header 'Origin: https://samabusiness.dakarstyle.com' \
            --header 'Access-Control-Request-Method: POST' \
            --dump-header api-options.headers --output /dev/null "$API_URL"

          python3 - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('api-health.json').read_text())
          assert health.get('ok') is True, health
          assert health.get('service') == 'samabusiness-api-v10', health
          assert health.get('version') == '10.1.0', health
          headers = Path('api-options.headers').read_text().lower()
          assert 'access-control-allow-origin: https://samabusiness.dakarstyle.com' in headers, headers
          PY

      - name: Test runtime finishing addon
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$ADDON_URL?v=10.1.0" -o addon.js
          grep -q '__SAMABUSINESS_FETCH_PATCHED__' addon.js
          grep -q '__SAMABUSINESS_PRODUCT_SELECTORS_PATCHED__' addon.js
          grep -q 'productSelectorFix:true' addon.js
          grep -q 'samabusiness-api-v10' addon.js
          grep -q 'samabusiness-192.webp' addon.js
          grep -q 'focus-visible' addon.js

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: samabusiness-release-validation
          path: |
            pwa-health.json
            manifest.headers
            manifest.json
            sw.headers
            sw.js
            icon.headers
            icon.svg
            api-health.json
            api-options.headers
            logo-file-type.txt
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker when Cloudflare credentials are configured
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 deploy

      - name: Record external integration deployment mode
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo 'Cloudflare Git integration is expected to deploy main; repository secrets are not configured.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production endpoints
        shell: bash
        run: |
          set +e
          sleep 25
          for url in \
            'https://dakarstyle.com/assets/samabusiness/samabusiness-192.webp' \
            'https://samacahier.dakarstyle.com/health' \
            'https://samabusiness.dakarstyle.com/health' \
            'https://samabusiness.dakarstyle.com/manifest.webmanifest' \
            'https://samabusiness.dakarstyle.com/sw.js'; do
            status=$(curl --location --silent --show-error --output /tmp/response --write-out '%{http_code}' --max-time 20 "$url")
            printf '%s -> %s\n' "$url" "$status" | tee -a production-checks.txt
          done
          cat production-checks.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production check evidence
        uses: actions/upload-artifact@v4
        with:
          name: samabusiness-production-checks
          path: production-checks.txt
          if-no-files-found: error
          retention-days: 14

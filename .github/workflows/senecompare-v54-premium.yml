name: SeneCompare premium ads and auth

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/senecompare-v54.js'
      - 'src/senecompare-v5-router.js'
      - 'senecompare/monetization-v54.*'
      - 'senecompare/admin-auth-v54.*'
      - 'supabase/functions/senecompare-media-v54/**'
      - 'supabase/migrations/*senecompare_verified_campaign_media_v54.sql'
      - 'tests/senecompare-v54-*.mjs'
      - '.github/workflows/senecompare-v54-premium.yml'
  push:
    branches: [main]
    paths:
      - 'src/senecompare-v54.js'
      - 'src/senecompare-v5-router.js'
      - 'senecompare/monetization-v54.*'
      - 'senecompare/admin-auth-v54.*'
      - 'supabase/functions/senecompare-media-v54/**'
      - 'supabase/migrations/*senecompare_verified_campaign_media_v54.sql'
      - 'tests/senecompare-v54-*.mjs'
      - '.github/workflows/senecompare-v54-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_URL: https://senecompare.dakarstyle.com
  MEDIA_EDGE: https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/senecompare-media-v54

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          set -euo pipefail
          node --check src/senecompare-v54.js
          node --check src/senecompare-v5-router.js
          node --check senecompare/monetization-v54.js
          node --check senecompare/admin-auth-v54.js
          node --check tests/senecompare-v54-contract.mjs
          node --check tests/senecompare-v54-browser-live.mjs
      - name: Run verified media and owner-auth contract
        run: node tests/senecompare-v54-contract.mjs
      - name: Run compatibility and privacy audits
        run: |
          node tests/senecompare-final-v52-static-audit.mjs
          node tests/senecompare-v53-static-audit.mjs
      - name: Validate Cloudflare bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-v54
      - name: Validate privacy, contact and source reproducibility
        run: |
          set -euo pipefail
          grep -q 'hellodakarstyle@gmail.com' senecompare/monetization-v54.js
          grep -q 'hellodakarstyle@gmail.com' senecompare/admin-auth-v54.js
          grep -q 'OWNER_INVALID' senecompare/admin-auth-v54.js
          grep -q 'TOKEN_EXPIRED' senecompare/admin-auth-v54.js
          grep -q 'senecompare-media-v54' src/senecompare-v54.js
          grep -q 'enable row level security' supabase/migrations/20260806014500_senecompare_verified_campaign_media_v54.sql
          grep -q 'notification_sent_at' supabase/migrations/20260806014500_senecompare_verified_campaign_media_v54.sql
          grep -q 'prefers-reduced-motion' senecompare/monetization-v54.css
      - name: Guard against secrets and embedded binaries
        run: |
          set -euo pipefail
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|Bearer[[:space:]]+[A-Za-z0-9._-]{24,})' \
            src/senecompare-v54.js senecompare/monetization-v54.* senecompare/admin-auth-v54.* supabase/functions/senecompare-media-v54; then
            echo 'Potential secret detected.' >&2
            exit 1
          fi
          if grep -RInE 'UklGR[A-Za-z0-9+/]{100}' supabase/migrations/20260806014500_senecompare_verified_campaign_media_v54.sql; then
            echo 'Campaign binary must stay outside Git history.' >&2
            exit 1
          fi

  media-live:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact supplied campaign media
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$MEDIA_EDGE/health" -o media-health.json
          curl --fail --silent --show-error "$MEDIA_EDGE/samabusiness-campaign.webp" -o samabusiness.webp
          curl --fail --silent --show-error "$MEDIA_EDGE/sowhat-africa-campaign.webp" -o sowhat-africa.webp
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          health=json.load(open('media-health.json'))
          assert health.get('ok') is True and health.get('version') == '5.4.0'
          expected={
            'samabusiness.webp':'70f06b9f5118a97302d9100282b255aec58dbf1320b95078d32bbfbcde36b12c',
            'sowhat-africa.webp':'ba9a293761943beb90712a41886b80d21b0ef7b916ee9b44347086bc8eae1b1d',
          }
          for name,digest in expected.items():
            data=Path(name).read_bytes()
            assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', name
            assert hashlib.sha256(data).hexdigest() == digest, name
            assert len(data) > 20000, name
          print('Exact supplied campaign media verified')
          PY
      - name: Upload media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senecompare-v54-media-evidence
          path: |
            media-health.json
            samabusiness.webp
            sowhat-africa.webp
          if-no-files-found: warn
          retention-days: 14

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: media-live
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for Cloudflare release
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 48); do
            root=$(curl -sS -H 'Cache-Control: no-cache' -D root.headers -o root.html -w '%{http_code}' "$APP_URL/?v=540&deploy=$GITHUB_RUN_ID" || true)
            admin=$(curl -sS -H 'Cache-Control: no-cache' -D admin.headers -o admin.html -w '%{http_code}' "$APP_URL/admin?v=540&deploy=$GITHUB_RUN_ID" || true)
            if [ "$root" = 200 ] && [ "$admin" = 200 ] \
              && grep -qi '^x-senecompare-release: 5.4.0' root.headers \
              && grep -qi '^x-senecompare-auth-recovery: verified-owner-link-v54' root.headers \
              && grep -q '/monetization-v54.js?v=540' root.html \
              && grep -q '/admin-auth-v54.js?v=540' admin.html; then
              ready=true
              break
            fi
            echo "Waiting ($attempt/48): root=$root admin=$admin"
            sleep 10
          done
          test "$ready" = true
      - name: Verify production media, contact and auth assets
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -D sowhat.headers "$APP_URL/media/sowhat-africa-campaign.jpg?v=540" -o sowhat.webp
          curl --fail --silent --show-error -D sama.headers "$APP_URL/media/samabusiness-campaign.webp?v=540" -o samabusiness.webp
          curl --fail --silent --show-error "$APP_URL/monetization-v54.js?v=540" -o monetization-v54.js
          curl --fail --silent --show-error "$APP_URL/admin-auth-v54.js?v=540" -o admin-auth-v54.js
          curl --fail --silent --show-error "$APP_URL/api/ads" -o ads.json
          curl --fail --silent --show-error --max-time 65 \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://senecompare.dakarstyle.com' \
            -H 'X-Client-Version: senecompare-v54-certified' \
            --data '{"query":"application pour gérer un commerce au Sénégal","language":"fr","session_id":"v54-certified"}' \
            "$APP_URL/api/search" -o search.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected={
            'samabusiness.webp':'70f06b9f5118a97302d9100282b255aec58dbf1320b95078d32bbfbcde36b12c',
            'sowhat.webp':'ba9a293761943beb90712a41886b80d21b0ef7b916ee9b44347086bc8eae1b1d',
          }
          for name,digest in expected.items():
            data=Path(name).read_bytes()
            assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
            assert hashlib.sha256(data).hexdigest() == digest
          assert 'content-type: image/webp' in Path('sowhat.headers').read_text().lower()
          assert 'content-type: image/webp' in Path('sama.headers').read_text().lower()
          auth=Path('admin-auth-v54.js').read_text()
          assert 'OWNER_INVALID' in auth and 'TOKEN_EXPIRED' in auth
          assert 'hellodakarstyle@gmail.com' in auth
          assert 'hellodakarstyle@gmail.com' in Path('monetization-v54.js').read_text()
          ads=json.load(open('ads.json'))
          assert ads.get('ok') is True and len(ads.get('campaigns',[])) >= 3
          search=json.load(open('search.json'))
          assert search.get('ok') is True and len(search.get('results',[])) >= 1
          assert 'senecompare ai' not in Path('root.html').read_text(errors='replace').lower()
          print('SeneCompare 5.4 production assets and continuity verified')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Verify desktop and Samsung journeys
        env:
          E2E_OUTPUT_DIR: test-results/senecompare-v54
        run: node tests/senecompare-v54-browser-live.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senecompare-v54-production-${{ github.run_id }}
          path: |
            root.html
            root.headers
            admin.html
            admin.headers
            sowhat.webp
            sowhat.headers
            samabusiness.webp
            sama.headers
            monetization-v54.js
            admin-auth-v54.js
            ads.json
            search.json
            test-results/senecompare-v54
          if-no-files-found: warn
          retention-days: 30

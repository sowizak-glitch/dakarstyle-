name: SAMABUSINESS field UX

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/worker-entry.js'
      - 'supabase/functions/samabusiness-field-ux/**'
      - 'supabase/functions/samabusiness-api-v10/**'
      - 'supabase/functions/samabusiness-supplier-api/**'
      - '.github/workflows/samabusiness-field-ux.yml'
  push:
    branches:
      - main
    paths:
      - 'src/worker-entry.js'
      - 'supabase/functions/samabusiness-field-ux/**'
      - 'supabase/functions/samabusiness-api-v10/**'
      - 'supabase/functions/samabusiness-supplier-api/**'
      - '.github/workflows/samabusiness-field-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FIELD_UX_URL: https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/samabusiness-field-ux?v=11.8.2
  SALES_API_URL: https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/samabusiness-api-v10
  SUPPLIER_URL: https://xmdpmtvieqgoorbxytey.supabase.co/functions/v1/samabusiness-supplier-api

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and validate versioned browser source
        shell: bash
        run: |
          set -euo pipefail
          cat supabase/functions/samabusiness-field-ux/parts/part-*.js > field-ux-local.js
          node --check field-ux-local.js
          grep -q '__SAMABUSINESS_FIELD_UX__' field-ux-local.js
          grep -q 'Partager sur WhatsApp' field-ux-local.js
          grep -q 'Commander sur WhatsApp' field-ux-local.js
          grep -q 'Wolof activé' field-ux-local.js
          grep -q '__SAMABUSINESS_NATIVE_PWA__' field-ux-local.js
          grep -q 'Importer un vocal WhatsApp' field-ux-local.js
          grep -q '__SAMABUSINESS_SALES_OPS_V2__' field-ux-local.js
          grep -q '__SAMABUSINESS_ICON_SYSTEM_V2026__' field-ux-local.js
          grep -q '__SAMABUSINESS_ICON_POLISH_V2026__' field-ux-local.js
          grep -q '__SAMABUSINESS_CLIENT_FINANCIAL_RECAP_V2026__' field-ux-local.js
          grep -q '__SAMABUSINESS_DESIGN_SYSTEM_V18_2__' field-ux-local.js
          grep -q 'sama-design-system-v18-2' field-ux-local.js
          grep -q '__SAMABUSINESS_COGNITIVE_COPILOT_V19__' field-ux-local.js
          grep -q 'SAMA Copilote' field-ux-local.js
          grep -q '__SAMABUSINESS_CAPTURE_MARKETING_V19__' field-ux-local.js
          grep -q 'SAMA Marketing Copilot' field-ux-local.js
          grep -q '__SAMABUSINESS_OPERATIONAL_INTELLIGENCE_V19__' field-ux-local.js
          grep -q 'sama-operational-intelligence-styles' field-ux-local.js
          grep -q 'Agent Bêta' field-ux-local.js
          grep -q 'WhatsApp à traiter' field-ux-local.js
          grep -q '__SAMABUSINESS_GUIDE_ENGINE_BRIDGE_V19__' field-ux-local.js
          grep -q 'sama-guide-engine-bridge-styles' field-ux-local.js
          grep -q 'copilot_interpret' field-ux-local.js
          grep -q 'Préférences SAMA' field-ux-local.js
          test "$(wc -c < field-ux-local.js)" -gt 215000

      - name: Validate API source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const VERSION = "10.4.0"' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'low_stock_threshold' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'raw_message' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'missing_fields' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'sama_expenses' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'sama_cash_movements' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'copilot_context: true' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'guide_v17: true' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'sama_guide_gateway_v17' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'copilot_interpret' supabase/functions/samabusiness-api-v10/index.ts
          grep -q 'copilot_save_settings' supabase/functions/samabusiness-api-v10/index.ts

      - name: Validate Worker injection
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker-entry.js
          grep -q 'samabusiness-field-ux' src/worker-entry.js
          grep -q 'data-samabusiness-field-ux' src/worker-entry.js
          grep -q 'manifest.webmanifest' src/worker-entry.js
          grep -q 'serviceWorker.register' src/worker-entry.js

      - name: Validate live field UX endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --dump-header field-ux.headers "$FIELD_UX_URL" -o field-ux-live.js
          node --check field-ux-live.js
          grep -qi 'application/javascript' field-ux.headers
          grep -qi 'x-samabusiness-field-ux: 11.8.2' field-ux.headers
          grep -q '__SAMABUSINESS_FIELD_UX__' field-ux-live.js
          grep -q '__SAMABUSINESS_SALES_OPS_V2__' field-ux-live.js
          grep -q '__SAMABUSINESS_WHATSAPP_BUSINESS_ROUTER__' field-ux-live.js
          grep -q '__SAMABUSINESS_WHATSAPP_DIRECT_V3__' field-ux-live.js
          grep -q '__SAMABUSINESS_ICON_SYSTEM_V2026__' field-ux-live.js
          grep -q '__SAMABUSINESS_ICON_POLISH_V2026__' field-ux-live.js
          grep -q '__SAMABUSINESS_CLIENT_FINANCIAL_RECAP_V2026__' field-ux-live.js
          grep -q '__SAMABUSINESS_DESIGN_SYSTEM_V18_2__' field-ux-live.js
          grep -q '__SAMABUSINESS_COGNITIVE_COPILOT_V19__' field-ux-live.js
          grep -q 'SAMA Copilote' field-ux-live.js
          grep -q '__SAMABUSINESS_CAPTURE_MARKETING_V19__' field-ux-live.js
          grep -q 'SAMA Marketing Copilot' field-ux-live.js
          grep -q '__SAMABUSINESS_OPERATIONAL_INTELLIGENCE_V19__' field-ux-live.js
          grep -q 'Agent Bêta' field-ux-live.js
          grep -q '__SAMABUSINESS_GUIDE_ENGINE_BRIDGE_V19__' field-ux-live.js
          grep -q 'copilot_interpret' field-ux-live.js
          grep -q 'Préférences SAMA' field-ux-live.js
          test "$(wc -c < field-ux-live.js)" -gt 235000

      - name: Validate live Sales Ops / Copilot API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --dump-header sales-api.headers "$SALES_API_URL" -o sales-api-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('sales-api-health.json').read_text())
          assert health.get('ok') is True, health
          assert health.get('service') == 'samabusiness-api-v10', health
          assert health.get('version') == '10.4.0', health
          assert health.get('sales_ops') is True, health
          assert health.get('copilot_context') is True, health
          assert health.get('guide_v17') is True, health
          headers = Path('sales-api.headers').read_text().lower()
          assert 'x-samabusiness-api-version: 10.4.0' in headers, headers
          PY

      - name: Verify protected copilot route rejects missing session
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output no-session.json --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --header 'Origin: https://samabusiness.dakarstyle.com' \
            --data '{"action":"copilot_interpret","text":"combien jai gagne"}' "$SALES_API_URL")
          test "$status" = "401"
          python3 - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('no-session.json').read_text())
          assert body.get('ok') is False, body
          assert 'Session' in body.get('error',''), body
          PY

      - name: Validate supplier endpoint and CORS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header 'Origin: https://samabusiness.dakarstyle.com' "$SUPPLIER_URL" -o supplier-health.json
          curl --fail --silent --show-error --request OPTIONS \
            --header 'Origin: https://samabusiness.dakarstyle.com' \
            --header 'Access-Control-Request-Method: POST' \
            --dump-header supplier-options.headers --output /dev/null "$SUPPLIER_URL"
          python3 - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('supplier-health.json').read_text())
          assert health.get('ok') is True, health
          assert health.get('service') == 'samabusiness-supplier-api', health
          assert health.get('version') == '10.2.0', health
          headers = Path('supplier-options.headers').read_text().lower()
          assert 'access-control-allow-origin: https://samabusiness.dakarstyle.com' in headers, headers
          PY

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: samabusiness-field-ux-validation
          path: |
            field-ux.headers
            field-ux-live.js
            sales-api.headers
            sales-api-health.json
            no-session.json
            supplier-health.json
            supplier-options.headers
          if-no-files-found: error
          retention-days: 14
